<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Browser Phone Controller</title>
  <style>
    body { background: #0f172a; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
    button { background: #0ea5e9; color: white; border: none; padding: 12px 24px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
    button:hover { background: #0284c7; }
    #status { color: #94a3b8; margin-bottom: 20px; font-family: monospace; }
    #screen-container { display: none; margin: 0 auto; border: 4px solid #38bdf8; border-radius: 12px; width: fit-content; overflow: hidden; }
    #phone-screen { display: block; max-height: 70vh; cursor: crosshair; }
  </style>
</head>
<body>

  <h2>Live Phone Remote</h2>
  <button id="connectBtn">1. Connect via Cable</button>
  <div id="status">Waiting to connect... (Make sure USB Debugging is ON)</div>

  <div id="screen-container">
    <img id="phone-screen" alt="Phone Display" />
  </div>

  <script type="module">
    import { Adb, AdbDaemonTransport } from 'https://esm.sh/@yume-chan/adb@0.0.22';
    import { AdbDaemonWebUsbDeviceManager } from 'https://esm.sh/@yume-chan/adb-backend-webusb@0.0.22';
    import { AdbCredentialWeb } from 'https://esm.sh/@yume-chan/adb-credential-web@0.0.22';

    const btn = document.getElementById('connectBtn');
    const status = document.getElementById('status');
    const container = document.getElementById('screen-container');
    const screen = document.getElementById('phone-screen');
    let adb = null;

    btn.addEventListener('click', async () => {
      try {
        status.innerText = "Select your phone from the browser prompt...";
        
        // 1. Request USB Access
        const Manager = AdbDaemonWebUsbDeviceManager.BROWSER;
        const device = await Manager.requestDevice();
        if (!device) return;

        status.innerText = "Connecting to device hardware...";
        const connection = await device.connect();

        // 2. Generate RSA Key & Trigger Android's "Allow USB Debugging" prompt
        status.innerText = "Check your phone screen and tap 'ALLOW USB DEBUGGING'...";
        const credentialStore = new AdbCredentialWeb();
        await credentialStore.generateKey();

        const transport = await AdbDaemonTransport.authenticate({
            serial: device.serial,
            connection,
            credentialStore,
        });
        
        adb = new Adb(transport);

        status.innerText = "Connected! Loading screen feed...";
        btn.style.display = "none";
        container.style.display = "block";

        streamScreen();
      } catch (err) {
        status.innerText = `Error: ${err.message}`;
      }
    });

    // 3. Capture Screen Feed (Raw ADB Screenshot Loop)
    async function streamScreen() {
      while (true) {
        try {
          const process = await adb.subprocess.spawn('screencap -p');
          const chunks = [];
          const reader = process.stdout.getReader();
          
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
          }

          const blob = new Blob(chunks, { type: 'image/png' });
          const url = URL.createObjectURL(blob);
          
          if (screen.src) URL.revokeObjectURL(screen.src);
          screen.src = url;
        } catch (e) {
          console.error("Screen read failed, retrying...");
          await new Promise(r => setTimeout(r, 1000));
        }
      }
    }

    // 4. Send Touch Inputs to Phone
    screen.addEventListener('click', async (e) => {
      if (!adb) return;
      const rect = screen.getBoundingClientRect();
      const scaleX = screen.naturalWidth / rect.width;
      const scaleY = screen.naturalHeight / rect.height;
      
      const realX = Math.round((e.clientX - rect.left) * scaleX);
      const realY = Math.round((e.clientY - rect.top) * scaleY);
      
      status.innerText = `Sent Tap at: ${realX}, ${realY}`;
      
      const process = await adb.subprocess.spawn(`input tap ${realX} ${realY}`);
      const reader = process.stdout.getReader();
      while (!(await reader.read()).done) {} 
    });
  </script>
</body>
</html>
