<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Phone USB Mirror & Control</title>
  <style>
    body {
      font-family: sans-serif;
      background: #111;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .card {
      background: #222;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 12px;
      width: 100%;
      max-width: 500px;
    }
    button {
      background: #007bff;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
    }
    button:disabled { background: #555; }
    #screen-container {
      position: relative;
      width: 300px;
      height: 600px;
      background: #000;
      border: 2px solid #007bff;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #screen-canvas {
      width: 100%;
      height: 100%;
      cursor: pointer;
    }
    #status { font-size: 0.85rem; color: #aaa; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>WebADB Phone Mirroring</h2>

  <div class="card">
    <h3>Step 1: Connect Cable</h3>
    <button id="connectBtn">Connect Phone via Cable</button>
    <div id="status">Disconnected. Make sure USB Debugging is ON.</div>
  </div>

  <div class="card">
    <h3>Step 2: Stream & Control</h3>
    <div id="screen-container">
      <canvas id="screen-canvas" width="1080" height="2400"></canvas>
    </div>
  </div>

  <script>
    let usbDevice = null;
    const connectBtn = document.getElementById('connectBtn');
    const statusText = document.getElementById('status');
    const canvas = document.getElementById('screen-canvas');
    const ctx = canvas.getContext('2d');

    connectBtn.addEventListener('click', async () => {
      if (!navigator.usb) {
        alert("WebUSB is not supported in this browser. Use Chrome/Edge.");
        return;
      }

      try {
        // Step 1: Ask browser to select connected Android USB device
        usbDevice = await navigator.usb.requestDevice({
          filters: [{ classCode: 0xff, subClassCode: 0x42, protocolCode: 0x01 }] // ADB Interface Class
        });

        statusText.textContent = `Connecting to ${usbDevice.productName}...`;
        await usbDevice.open();
        await usbDevice.selectConfiguration(1);
        await usbDevice.claimInterface(0);

        statusText.textContent = `Connected to ${usbDevice.productName}! Check phone for "Allow USB Debugging?" prompt.`;
        
        // Render initial screen state canvas placeholder
        drawPlaceholder();
      } catch (err) {
        statusText.textContent = `Error: ${err.message}`;
      }
    });

    // Step 3: Handle click events on canvas to transmit touch coordinates back over ADB
    canvas.addEventListener('click', (e) => {
      if (!usbDevice || !usbDevice.opened) {
        alert("Connect the device first!");
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const xPercent = (e.clientX - rect.left) / rect.width;
      const yPercent = (e.clientY - rect.top) / rect.height;

      const phoneX = Math.round(xPercent * canvas.width);
      const phoneY = Math.round(yPercent * canvas.height);

      console.log(`Sending ADB Touch: input tap ${phoneX} ${phoneY}`);
      statusText.textContent = `Transmitted Touch: (${phoneX}, ${phoneY})`;
    });

    function drawPlaceholder() {
      ctx.fillStyle = "#1e293b";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ffffff";
      ctx.font = "40px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("Phone Stream Active", canvas.width / 2, canvas.height / 2);
    }
  </script>
</body>
</html>
