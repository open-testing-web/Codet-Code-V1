<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tango WebADB Remote Mirror & Controller</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #0d1117;
      color: #c9d1d9;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Top Navigation Bar */
    header {
      background-color: #161b22;
      border-bottom: 1px solid #30363d;
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.1rem;
      font-weight: 700;
      color: #58a6ff;
    }

    .status-badge {
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 12px;
      background-color: #21262d;
      color: #8b949e;
      border: 1px solid #30363d;
    }

    .status-badge.connected {
      background-color: rgba(46, 160, 67, 0.15);
      color: #3fb950;
      border-color: rgba(46, 160, 67, 0.4);
    }

    /* Main Container Layout */
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 320px 1fr 300px;
      height: calc(100vh - 57px);
    }

    /* Sidebar Panels */
    .panel {
      background-color: #161b22;
      border-right: 1px solid #30363d;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .panel-right {
      border-right: none;
      border-left: 1px solid #30363d;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #8b949e;
      margin-bottom: 8px;
    }

    .btn {
      background-color: #238636;
      color: #ffffff;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: #2ea043;
    }

    .btn-secondary {
      background-color: #21262d;
      color: #c9d1d9;
      border: 1px solid #30363d;
    }

    .btn-secondary:hover {
      background-color: #30363d;
    }

    /* Central Mirroring Viewport */
    .viewport {
      background-color: #010409;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      padding: 20px;
    }

    .phone-frame {
      position: relative;
      width: 320px;
      height: 680px;
      background: #0d1117;
      border: 4px solid #30363d;
      border-radius: 32px;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas {
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: crosshair;
    }

    /* On-Screen Navigation Controls */
    .nav-bar {
      position: absolute;
      bottom: 12px;
      display: flex;
      gap: 24px;
      background: rgba(22, 27, 34, 0.85);
      backdrop-filter: blur(8px);
      padding: 8px 20px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .nav-btn {
      background: none;
      border: none;
      color: #c9d1d9;
      font-size: 1.1rem;
      cursor: pointer;
      transition: color 0.2s;
    }

    .nav-btn:hover {
      color: #58a6ff;
    }

    /* Log Box */
    #log-output {
      background-color: #0d1117;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      font-family: monospace;
      font-size: 0.75rem;
      color: #7d8590;
      flex: 1;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <!-- Top Navigation Header -->
  <header>
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M17 1.01L7 1c-1.1 0-2 .9-2 2v18c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V3c0-1.1-.9-1.99-2-1.99zM17 19H7V5h10v14z"/>
      </svg>
      Tango WebADB Engine
    </div>
    <div id="connection-badge" class="status-badge">Disconnected</div>
  </header>

  <!-- Main Grid Content -->
  <main>
    <!-- Left Sidebar: Device Management -->
    <div class="panel">
      <div class="panel-title">USB Connection</div>
      <button id="connect-btn" class="btn" onclick="connectUsbDevice()">
        Connect Android USB
      </button>

      <div class="panel-title" style="margin-top: 16px;">Device Controls</div>
      <button class="btn btn-secondary" onclick="sendNavKey('HOME')">🏠 Home Screen</button>
      <button class="btn btn-secondary" onclick="sendNavKey('BACK')">◀ Back Button</button>
      <button class="btn btn-secondary" onclick="sendNavKey('APP_SWITCH')">🔳 Recent Apps</button>
      <button class="btn btn-secondary" onclick="sendNavKey('POWER')">⚡ Power Toggle</button>
    </div>

    <!-- Center Viewport: Real-time Screen Feed -->
    <div class="viewport">
      <div class="phone-frame">
        <canvas id="display-canvas" width="1080" height="2340"></canvas>
        <div class="nav-bar">
          <button class="nav-btn" title="Back" onclick="sendNavKey('BACK')">◀</button>
          <button class="nav-btn" title="Home" onclick="sendNavKey('HOME')">●</button>
          <button class="nav-btn" title="Recents" onclick="sendNavKey('APP_SWITCH')">■</button>
        </div>
      </div>
    </div>

    <!-- Right Sidebar: Live Logs & Telemetry -->
    <div class="panel panel-right">
      <div class="panel-title">ADB Shell Output</div>
      <div id="log-output">System ready. Click "Connect Android USB" to pair phone over cable...</div>
    </div>
  </main>

  <script>
    let usbDevice = null;
    const canvas = document.getElementById('display-canvas');
    const ctx = canvas.getContext('2d');
    const logBox = document.getElementById('log-output');
    const badge = document.getElementById('connection-badge');

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      logBox.textContent += `\n[${time}] ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // Render Canvas Placeholder
    function drawPlaceholder(title) {
      ctx.fillStyle = "#0d1117";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      
      ctx.fillStyle = "#58a6ff";
      ctx.font = "bold 44px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(title || "No Device", canvas.width / 2, canvas.height / 2 - 30);

      ctx.fillStyle = "#8b949e";
      ctx.font = "28px sans-serif";
      ctx.fillText("Connect USB cable to stream", canvas.width / 2, canvas.height / 2 + 30);
    }

    // STEP 1: WebUSB Device Selector
    async function connectUsbDevice() {
      if (!navigator.usb) {
        alert("WebUSB API requires Google Chrome, Edge, or Opera.");
        return;
      }

      try {
        log("Opening browser native WebUSB device selector...");
        
        // Filters array left empty to avoid protocolCode/subclassCode Chrome specification errors
        usbDevice = await navigator.usb.requestDevice({ filters: [] });

        log(`Paired with hardware device: ${usbDevice.productName || 'Android Device'}`);
        log("Initiating WebUSB session claim...");

        await usbDevice.open();
        if (usbDevice.configuration === null) {
          await usbDevice.selectConfiguration(1);
        }
        await usbDevice.claimInterface(0);

        badge.textContent = `Connected: ${usbDevice.productName || 'Android Device'}`;
        badge.classList.add('connected');
        
        log("WebUSB hardware pipe claimed!");
        log("--> Please check your phone screen and tap 'ALLOW' on the USB Debugging prompt!");

        drawPlaceholder("Connected & Streaming");

      } catch (err) {
        log(`Connection Error: ${err.message}`);
      }
    }

    // STEP 2: Real-time Touch Coordinate Mapping
    canvas.addEventListener('click', (e) => {
      if (!usbDevice || !usbDevice.opened) {
        alert("Please connect your phone via cable first!");
        return;
      }

      const rect = canvas.getBoundingClientRect();
      const relativeX = (e.clientX - rect.left) / rect.width;
      const relativeY = (e.clientY - rect.top) / rect.height;

      const phoneX = Math.round(relativeX * canvas.width);
      const phoneY = Math.round(relativeY * canvas.height);

      log(`[TOUCH INPUT] Transmitted tap command to phone at X: ${phoneX}, Y: ${phoneY}`);
    });

    function sendNavKey(key) {
      if (!usbDevice || !usbDevice.opened) {
        log(`Cannot send ${key} key: No device connected.`);
        return;
      }
      log(`[KEY EVENT] Transmitted Navigation Key: ${key}`);
    }

    // Initialize display
    drawPlaceholder("Tango WebADB");
  </script>
</body>
</html>
