<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Raw WebADB Controller</title>
  <style>
    body {
      background-color: #121212;
      color: #00ff66;
      font-family: monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    #controls {
      margin-bottom: 20px;
      text-align: center;
    }
    button {
      background: #00ff66;
      color: #000;
      font-weight: bold;
      border: none;
      padding: 10px 20px;
      cursor: pointer;
      font-size: 16px;
      border-radius: 4px;
    }
    button:hover { background: #00cc55; }
    #status { margin-top: 10px; font-size: 14px; }
    #phone-screen {
      max-width: 320px; /* Adjust size on your computer */
      border: 2px solid #00ff66;
      border-radius: 12px;
      cursor: crosshair;
      display: none; /* Hidden until connected */
    }
  </style>
</head>
<body>

  <div id="controls">
    <button id="connectBtn">Connect Phone</button>
    <div id="status">Status: Waiting for USB...</div>
  </div>

  <!-- This image tag will display the live screenshots from the phone -->
  <img id="phone-screen" alt="Phone Screen Feed" />

  <!-- Import the WebADB libraries directly from ESM modules -->
  <script type="module">
    import { Adb, AdbDaemonTransport } from 'https://esm.sh/@yume-chan/adb@0.0.20';
    import { AdbDaemonWebUsbDeviceManager } from 'https://esm.sh/@yume-chan/adb-backend-webusb@0.0.20';
    import { AdbCredentialWeb } from 'https://esm.sh/@yume-chan/adb-credential-web@0.0.20';

    const connectBtn = document.getElementById('connectBtn');
    const statusEl = document.getElementById('status');
    const screenImg = document.getElementById('phone-screen');
    
    let adbSession = null;

    connectBtn.addEventListener('click', async () => {
      try {
        statusEl.innerText = "Status: Select your device from the Chrome popup...";
        
        // 1. Request USB Device via Native Browser Prompt
        const Manager = AdbDaemonWebUsbDeviceManager.BROWSER;
        const device = await Manager.requestDevice();
        
        if (!device) {
          statusEl.innerText = "Status: Connection cancelled.";
          return;
        }

        statusEl.innerText = "Status: Device found! Check your phone screen and tap 'ALLOW USB DEBUGGING'.";
        const connection = await device.connect();

        // 2. Generate RSA Security Keys for Android Auth
        const credentialStore = new AdbCredentialWeb();
        await credentialStore.generateKey(); // Creates key if it doesn't exist

        // 3. Complete the ADB Handshake
        const transport = await AdbDaemonTransport.authenticate({
            serial: device.serial,
            connection,
            credentialStore,
        });
        
        adbSession = new Adb(transport);

        statusEl.innerText = "Status: Connected successfully! Starting screen feed...";
        screenImg.style.display = "block";
        connectBtn.style.display = "none";

        // Start the continuous screenshot loop
        startScreenFeed();

      } catch (err) {
        statusEl.innerText = `Error: ${err.message}`;
        console.error(err);
      }
    });

    // --- CONTINUOUS SCREENSHOT LOOP ---
    async function startScreenFeed() {
      while (true) {
        try {
          // Ask Android to take a raw screenshot and output the PNG bytes
          const process = await adbSession.subprocess.spawn('screencap -p');
          const reader = process.stdout.getReader();
          const chunks = [];
          
          // Read all the bytes coming through the USB cable
          while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            chunks.push(value);
          }

          // Convert raw bytes into an Image and render it
          const blob = new Blob(chunks, { type: 'image/png' });
          const url = URL.createObjectURL(blob);
          
          if (screenImg.src) {
             URL.revokeObjectURL(screenImg.src); // Prevent memory leaks
          }
          screenImg.src = url;

        } catch (e) {
          console.error("Screenshot error, retrying...", e);
          await new Promise(resolve => setTimeout(resolve, 1000));
        }
      }
    }

    // --- REMOTE TOUCH CONTROL ---
    screenImg.addEventListener('click', async (e) => {
      if (!adbSession) return;
      
      const rect = screenImg.getBoundingClientRect();
      
      // Calculate where you clicked relative to the real phone's resolution
      const scaleX = screenImg.naturalWidth / rect.width;
      const scaleY = screenImg.naturalHeight / rect.height;
      
      const realX = Math.round((e.clientX - rect.left) * scaleX);
      const realY = Math.round((e.clientY - rect.top) * scaleY);
      
      statusEl.innerText = `Status: Sending touch at X:${realX}, Y:${realY}`;
      
      // Execute the Android tap command over ADB
      const process = await adbSession.subprocess.spawn(`input tap ${realX} ${realY}`);
      
      // Wait for the tap command to finish sending
      const reader = process.stdout.getReader();
      while (true) {
        const { done } = await reader.read();
        if (done) break;
      }
      
      statusEl.innerText = `Status: Screen Feed Active`;
    });
  </script>
</body>
</html>
